# FancyNpcsModel 配置参考。
# 实际文件位于 plugins/FancyNpcsModel/config.yml；启动/重载会自动补齐缺少的字段。
# 修改后执行 /fancynpcsmodel config reload，无需删除 NPC 数据或重新导入模型。
settings:
  logging:
    level: INFO
    version_notification: false
  language: default
  modelengine:
    viewer-protection:
      # 每个 NPC 保留先进入可见范围的观看者；超额玩家看到原来的基础 NPC。
      # 名额按主插件可见性、世界和距离判断，不按玩家摄像机是否正对 NPC 判断。
      enabled: true
      # 0 全部使用基础 NPC；enabled: false 取消人数限制。
      # 沿用主插件刷新间隔，最低 20 tick；退出后按等待顺序补位。
      max-viewers-per-npc: 10
    head-tracking:
      # 还需对 NPC 启用 /npc turn_to_player <npc> true；追踪范围沿用 FancyNpcs 设置。
      enabled: true
      # 视线起点读取模型眼睛骨骼，独立于碰撞箱；所有参数支持配置重载。
      eye-height:
        bone-names: [Eyes, Eye, Head]
        # -1 自动读取；非负值指定 1 倍模型的眼高（格），再乘 NPC 缩放。
        fixed-height-blocks: -1.0
        # 加在 1 倍眼高上的修正（格），正值提高视线起点，随缩放变化。
        offset-blocks: 0.0
      # 正值更低头，负值更抬头；仍受 max-pitch-degrees 限制。
      pitch-offset-degrees: 0.0
      # 缺少 h_/hi_ 头部行为的模型，在当前 NPC 实例上补齐，原蓝图保持不变。
      runtime-head-bone:
        enabled: true
        # 按顺序选择第一个匹配的骨骼，忽略大小写；子骨骼继承头部旋转。
        bone-names:
          - Head
          - AllHead
      # 相对于身体当前朝向的头部旋转限制，单位：度。
      max-yaw-degrees: 65.0
      max-pitch-degrees: 35.0
      # 每秒最大转动角度；默认每 tick 最多水平 9 度、垂直 6 度。
      yaw-speed-degrees-per-second: 180.0
      pitch-speed-degrees-per-second: 120.0
      # 平滑响应系数，越低越柔和、越高越快；微小角度差由死区忽略。
      response-per-second: 8.0
      dead-zone-degrees: 0.25
      # 新玩家至少比当前目标近 20%，且已保持当前目标 0.75 秒后才切换。
      switch-distance-ratio: 0.8
      minimum-target-hold-seconds: 0.75
      lost-target-grace-seconds: 0.2
      # 当前目标可在基础追踪范围外额外停留 15%，减少边界抖动。
      exit-range-multiplier: 1.15
    body-follow:
      # 默认头先看过去，身体随后平滑跟上；关闭后保持身体当前朝向。
      enabled: true
      # 头部相对肩膀偏转达到此角度并持续 delay-seconds 后开始转身。
      # 超过 head-tracking.max-yaw-degrees 的值会自动限制到头部角度上限。
      start-angle-degrees: 35.0
      # 身体开始跟随后持续追到基本对齐，不在起转阈值附近反复启停。
      stop-angle-degrees: 2.0
      delay-seconds: 0.3
      yaw-speed-degrees-per-second: 90.0
      response-per-second: 5.0
      # 坐下等姿态可继续转头，身体保持原朝向；睡眠等动作同时暂停头部追踪。
      pause-during-pose: true
    idle:
      # 自动循环微动作；设为 false 可关闭本插件的自动微动作及随机手势。
      enabled: true
      default-states:
        idle: idle
        walk: walk
        jump: jump
        death: death
      # 按列表顺序使用优先级 1、2、3……；模型没有的动画会跳过。
      # 对应酒狐 MM 配置：飘带、尾发、眨眼同时 LOOP。
      loop-animations:
        - ribbon_sway
        - tail_hair_sway
        - blink
      random-gestures:
        # 默认关闭；启用后只从模型已有的候选动画中选择。
        enabled: false
        animations:
          - smile
          - nod
        # 20 tick = 1 秒；默认间隔 8~20 秒。
        min-interval-ticks: 160
        max-interval-ticks: 400
    animations:
      # 单位：秒。0.05 秒 = MM 的 li/lo 1 tick，切换时保持及时响应。
      blend-in-seconds: 0.05
      blend-out-seconds: 0.05
      speed: 1.0
      gesture-speed: 1.35
      # 手动姿态优先级 5，普通手势优先级 4；姿态使用正常 speed。
      pose-animations:
        - crouch_idle
        - sit
        - sleep
        - climb_idle
      # 这些动作播放期间由动画控制头部，暂时停止叠加玩家追踪。
      head-tracking-pause-animations:
        - sleep
        - nod
        - talk
        - wave
      pause-random-gestures-during-pose: true
